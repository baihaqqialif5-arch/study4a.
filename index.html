<!DOCTYPE html><html lang="ms"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>Study4A</title>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700&family=Nunito:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#fff8ec;--sf:#fff;--tx:#3a3355;--mu:#6f688a;--p:#8b6fe0;--pl:#e6dcff;--bl:#dff2ff;--g:#c7f0d4;--y:#fff0a6;--o:#ffd9c2;--r:#ffc9c9;--bd:#e4dcc8;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#1f1b2e;--sf:#2b2640;--tx:#f1edff;--mu:#b9b2d6;--pl:#3d3461;--bl:#223a4d;--g:#254634;--y:#4d4521;--o:#4d3526;--r:#4d2a2a;--bd:#3d3758}.note,.g1,.y1,.r1,.btn.g,.btn.o,.badge{color:var(--tx)!important}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.5 Nunito,system-ui,sans-serif}
h1,h2,h3,.bf{font-family:'Baloo 2',Nunito,system-ui,sans-serif;margin:.2em 0}
header{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:space-between;padding:12px 18px;background:var(--sf);border-bottom:2px dashed var(--bd)}
.logo{font:700 26px 'Baloo 2',sans-serif;color:var(--p);cursor:pointer;background:none;border:0}nav{display:flex;gap:6px;flex-wrap:wrap}
nav button{border:0;background:none;color:var(--tx);font:700 15px Nunito,sans-serif;padding:8px 12px;border-radius:99px;cursor:pointer}nav button.on,nav button:hover{background:var(--pl)}
main{max-width:1100px;margin:0 auto;padding:18px}
.card{background:var(--sf);border:2px solid var(--bd);border-radius:22px;padding:18px;box-shadow:0 4px 0 var(--bd)}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:16px}
.btn{border:0;border-radius:99px;padding:10px 20px;font:700 15px Nunito,sans-serif;cursor:pointer;background:var(--p);color:#fff;transition:transform .15s}.btn:hover{transform:translateY(-2px)}
.btn.s{background:var(--pl);color:var(--tx)}.btn.g{background:var(--g);color:#1f4d33}.btn.o{background:var(--o);color:#6b3a1c}.btn:disabled{opacity:.5}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
textarea,input[type=text]{width:100%;border:2px solid var(--bd);border-radius:14px;padding:10px;font:inherit;background:var(--bg);color:var(--tx)}textarea{min-height:170px}
.hero{background:linear-gradient(135deg,var(--pl),var(--bl));position:relative;overflow:hidden}.hero .st{position:absolute;font-size:30px;animation:fl 4s ease-in-out infinite}
@keyframes fl{50%{transform:translateY(-8px) rotate(8deg)}}
.tc{position:relative;transition:transform .2s}.tc:hover{transform:rotate(-1deg) translateY(-4px)}.em{font-size:44px}.badge{position:absolute;top:10px;right:10px;background:var(--y);color:#5a4b00;border-radius:99px;padding:2px 10px;font-size:13px;font-weight:700}
.goal{display:block;width:100%;text-align:left;margin:6px 0;padding:10px 14px;border-radius:14px;border:2px solid var(--bd);background:var(--bg);color:var(--tx);font:inherit;cursor:pointer}.goal.on{border-color:var(--p);background:var(--pl)}
.note{background:var(--y);color:#5a4b00;border-radius:12px;padding:8px 12px;font-size:14px}.err{color:#c0392b;font-weight:700}
.fc{height:240px;cursor:pointer;margin:14px 0;transition:transform .18s ease;user-select:none}.fi{position:relative;height:100%}
.fs{position:absolute;inset:0;backface-visibility:hidden;border-radius:22px;display:flex;align-items:center;justify-content:center;text-align:center;padding:22px;font-size:19px;font-weight:700;background:var(--bl);border:2px solid var(--bd)}.bk{display:none;background:var(--g)}.fc.f .bk{display:flex}.fc.f .fs:not(.bk){display:none}
.big{font:700 54px 'Baloo 2',sans-serif;text-align:center}.ring{display:block;margin:auto}
.dots{display:flex;gap:10px;justify-content:center;margin:10px}.dot{width:34px;height:34px;border-radius:50%;background:var(--pl);display:grid;place-items:center}.dot.d{background:var(--g)}
#modal{position:fixed;inset:0;background:#0006;display:none;place-items:center;z-index:9;padding:16px}#modal.on{display:grid}#modal .card{max-width:420px;width:100%}
#toast{position:fixed;bottom:calc(20px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);background:var(--p);color:#fff;padding:10px 20px;border-radius:99px;display:none;z-index:10;font-weight:700}
.mmw{overflow:auto;background:var(--sf);border:2px solid var(--bd);border-radius:22px;max-height:70vh}.mmw g{cursor:pointer}.mmw text{fill:#2b2540;font:700 12.5px Nunito,sans-serif}
.g1{background:var(--g);color:#1f4d33;padding:2px 6px;border-radius:6px}.y1{background:var(--y);color:#5a4b00;padding:2px 6px;border-radius:6px}.r1{background:var(--r);color:#7a1f1f;padding:2px 6px;border-radius:6px}
.bar{height:16px;border-radius:99px;background:var(--p);min-width:6px}.chip{display:inline-block;background:var(--pl);border-radius:99px;padding:2px 12px;margin:3px}
.emp{text-align:center;padding:30px;color:var(--mu)}.fl{display:inline-block;animation:fl 1.2s ease-in-out infinite}.emo{font-size:34px}.eb{border:2px solid var(--bd);background:var(--bg);border-radius:16px;padding:8px 12px;cursor:pointer;font:inherit;color:var(--tx)}.eb.on{border-color:var(--p);background:var(--pl)}.calm{background:linear-gradient(135deg,var(--g),var(--bl))}
.gw{position:relative;width:100%;max-width:900px;margin:8px auto;aspect-ratio:2/1;border:3px solid var(--bd);border-radius:14px;overflow:hidden;background:#000}.gw canvas{width:100%;height:100%;display:block;image-rendering:pixelated}.gov{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;background:rgba(15,23,42,.88);color:#fff;z-index:5}.hide{display:none!important}.gt{position:absolute;bottom:6%;display:none;gap:10px;z-index:4}.gl{left:10px}.gr{right:10px}.gt button{width:60px;height:56px;border-radius:14px;border:2px solid #94a3b8;background:#1e293bcc;color:#fff;font-size:20px;touch-action:none}.gt #g_bj{width:100px;font-size:13px;background:#f59e0bcc;color:#1c1917}@media(pointer:coarse){.gt{display:flex}}.drop{border:3px dashed var(--bd);border-radius:18px;padding:18px;text-align:center;cursor:pointer;background:var(--bg);margin-bottom:8px}.drop:hover{border-color:var(--p);background:var(--pl)}</style></head><body>
<header><button class="logo" data-a="go" data-v="home">✏️ Study4A</button><nav id="nav"></nav></header>
<main id="m"></main><div id="modal"></div><div id="toast"></div>
<script>
const $=s=>document.querySelector(s),esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let S={name:'',notes:'',prog:[],saved:{}};try{Object.assign(S,JSON.parse(localStorage.getItem('s4a')||'{}'))}catch(e){}
const save=()=>{try{localStorage.setItem('s4a',JSON.stringify(S))}catch(e){}};
let V={},view='home',timer=null,TM={left:0,total:1,run:false,end:0,cb:null};
const SW=new Set('yang dan atau untuk dengan dalam adalah ialah pada kepada daripada ini itu juga akan telah boleh mereka sebagai oleh tetapi kerana apabila supaya antara serta lebih which their there these those about would could should because'.split(' '));
const sents=t=>t.split(/(?<=[.!?])\s+|\n+/).map(x=>x.trim()).filter(x=>x.length>8);
const words=t=>t.toLowerCase().match(/[\p{L}\p{N}]+/gu)||[];
const keyw=(t,n)=>{const f={};words(t).forEach(w=>{if(w.length>4&&!SW.has(w))f[w]=(f[w]||0)+1});return Object.keys(f).sort((x,y)=>f[y]*y.length-f[x]*x.length).slice(0,n)};
const cap=s=>s.charAt(0).toUpperCase()+s.slice(1);
const fmt=ms=>{const s=Math.ceil(ms/1000);return Math.floor(s/60)+':'+String(s%60).padStart(2,'0')};
const toast=m=>{const t=$('#toast');t.textContent=m;t.style.display='block';clearTimeout(t.h);t.h=setTimeout(()=>t.style.display='none',2200)};
const modal=h=>{$('#modal').innerHTML='<div class="card">'+h+'</div>';$('#modal').className='on'},closeM=()=>$('#modal').className='';
const log=(t,min,info)=>{S.prog.unshift({t,min,info,d:Date.now()});S.prog=S.prog.slice(0,200);S.days=S.days||[];const k=dk();if(!S.days.includes(k)){S.days.push(k);const n=streak().cur;if([3,7,14,30,60,100].includes(n)){const m='Wow! '+n+' days of consistent learning. Keep it up! 🔥';if($('#modal').className==='on')toast(m);else modal('<h3>🔥 '+n+' Day Streak</h3><p>'+m+'</p><button class="btn" data-a="closeM">Yay!</button>')}}save()};
function beep(){[659,784,988].forEach((f,i)=>piano(f,.9,.07,i*.28))}
function startT(sec,cb){TM={total:sec*1000,left:sec*1000,end:Date.now()+sec*1000,run:true,cb};clearInterval(timer);timer=setInterval(tick,250);tick()}
function prep(sec){clearInterval(timer);TM={total:sec*1000,left:sec*1000,end:0,run:false,cb:null}}
function tick(){if(TM.run){TM.left=Math.max(0,TM.end-Date.now());const q=Math.ceil(TM.left/1000);if(q<=5&&q>0&&q!==TM.q){TM.q=q;piano(1047,.2,.03)}}paint();if(TM.run&&TM.left<=0){TM.run=false;clearInterval(timer);beep();TM.cb&&TM.cb()}}
function paint(){const e=$('#tm');if(e)e.textContent=fmt(TM.left);const r=$('#ring');if(r)r.style.strokeDashoffset=(1-TM.left/TM.total)*565}
const ringH=()=>`<svg class="ring" width="220" height="220" viewBox="0 0 220 220"><circle cx="110" cy="110" r="90" fill="none" stroke="var(--pl)" stroke-width="16"/><circle id="ring" cx="110" cy="110" r="90" fill="none" stroke="var(--p)" stroke-width="16" stroke-linecap="round" stroke-dasharray="565" transform="rotate(-90 110 110)"/></svg><div class="big" style="margin-top:-135px;margin-bottom:75px" id="tm"></div>`;

const T={
sm:{n:'Smart Summary',f:'Ringkasan Pintar',e:'📝',d:'Ringkasan nota yang tepat dan tersusun.',u:'Memahami & ulang kaji',apa:'Smart Summary menyusun nota panjang kepada tajuk, isi penting, definisi, contoh dan kata kunci.',why:'Supaya anda faham struktur nota tanpa menghafal semua ayat.',when:'Bila nota panjang dan perlu diulang kaji dengan pantas.',ex:'Nota Fotosintesis menjadi definisi, bahan, hasil dan kata kunci.',st:['Tampal atau muat naik nota','Pilih tahap: Simple, Standard atau Detailed','Tekan Generate Summary','Edit, salin, simpan atau tukar kepada Mind Map']},mm:{n:'Mind Mapping',f:'MindMap',e:'🗺️',d:'Tukar nota panjang kepada peta minda.',u:'Memahami fakta & proses',apa:'Teknik meringkaskan nota kepada idea utama dan cabang dalam bentuk peta minda (mind map).',why:'Supaya anda nampak hubungan antara isi dan tidak perlu menghafal ayat penuh.',when:'Bila nota panjang atau perlu faham proses/urutan.',ex:'Topik "Fotosintesis" → cabang: Bahan, Tempat, Hasil.',st:['Tampal nota','Tekan Generate Mind Map','Edit cabang mengikut kefahaman anda','Simpan atau salin ringkasan']},
fc:{n:'Flashcard Learning',f:'Flip & Learn',e:'🃏',d:'Kad soalan di depan, jawapan di belakang.',u:'Menghafal & menguji ingatan',apa:'Flashcard ialah kad bersoalan di hadapan dan berjawapan di belakang.',why:'Mengingat semula (active recall) lebih berkesan daripada membaca berulang kali.',when:'Bila perlu hafal istilah, definisi atau fakta.',ex:'Depan: "Apakah ibu negara Malaysia?" Belakang: "Kuala Lumpur".',st:['Tampal nota (format "istilah: maksud" paling tepat)','Tekan Generate Flashcards','Cuba jawab dalam fikiran, kemudian klik kad','Tekan I Know This atau Need More Practice']},
mn:{n:'Mnemonic Techniques',f:'Memory Magic',e:'✨',d:'Cipta akronim untuk senarai yang susah dihafal.',u:'Menghafal senarai',apa:'Mnemonics ialah teknik mengingat guna huruf, perkataan atau ayat yang mudah diingati.',why:'Otak lebih mudah ingat perkataan pendek daripada senarai panjang.',when:'Bila perlu hafal senarai berturutan.',ex:'Merah, Jingga, Kuning → "MJK".',st:['Masukkan senarai (asingkan dengan koma atau baris baharu)','Tekan Create My Mnemonic','Semak huruf dan maksudnya','Cuba Practice Mode']},
po:{n:'Pomodoro Technique',f:'Focus Time',e:'🍅',d:'Belajar fokus 25 minit, kemudian rehat.',u:'Ulang kaji & kekal fokus',apa:'Pomodoro ialah pengurusan masa: sesi fokus diselangi rehat.',why:'Mengelakkan penat dan memberi otak masa berehat.',when:'Bila susah fokus atau banyak topik untuk disemak.',ex:'25 minit belajar, 5 minit rehat, ulang 4 kali, kemudian rehat panjang 30 minit.',st:['Tekan Start','Belajar tanpa gangguan sehingga bunyi loceng','Berehat apabila diminta','Selesaikan 4 sesi untuk satu kitaran']},
bl:{n:'Blurting Method (Active Recall)',f:'Brain Dump',e:'🧠',d:'Baca, tutup nota, tulis semula apa yang diingat.',u:'Menguji diri sendiri',apa:'Blurting ialah teknik aktif: tulis semula semua yang diingat tanpa melihat nota.',why:'Menunjukkan dengan jujur bahagian yang anda belum kuasai.',when:'Bila mahu menguji diri sebelum ujian.',ex:'Baca nota 10 minit, tutup, tulis semua yang diingat, kemudian semak.',st:['Tampal nota','Baca 10 minit','Tulis di kertas atau dalam website','Semak hasil: hijau, kuning, merah']}};
const G={mem:{l:'Memorising',d:'Saya mahu menghafal fakta, istilah, definisi atau maklumat.',r:['fc','mn'],w:'Flashcard melatih ingatan, Mnemonics memudahkan senarai panjang.'},fact:{l:'Understanding Facts',d:'Saya mahu memahami dan mengingati fakta penting.',r:['mm'],w:'Peta minda menunjukkan idea utama dan hubungan antara fakta.'},proc:{l:'Understanding Processes',d:'Saya mahu memahami proses, langkah atau urutan.',r:['mm'],w:'Cabang peta minda sesuai untuk menyusun langkah dan urutan.'},rev:{l:'Revision',d:'Saya mahu mengulang kaji topik yang telah dipelajari.',r:['po','fc'],w:'Pomodoro memberi sesi fokus, Flashcard mengulang isi penting.'},test:{l:'Self-Testing',d:'Saya mahu menguji sejauh mana saya ingat.',r:['bl','fc'],w:'Blurting dan Flashcard memaksa anda mengingat tanpa melihat nota.'}};
const Q=['Sedikit demi sedikit, lama-lama jadi bukit.','Kesilapan ialah tanda anda sedang belajar.','Fokus 25 minit hari ini, bangga esok hari.','Tak faham? Belum faham lagi!','Rehat itu sebahagian daripada belajar.','Usaha kecil setiap hari mengalahkan bergadang semalam.'];
const NV=[['home','Home'],['tech','Study Techniques'],['lib','My Library'],['emo','Mind & Emotion'],['prog','My Progress'],['about','About']];

function go(v,force){if(view==='po'&&TM.run&&!force&&v!=='po'){modal('<h3>Sesi sedang berjalan ⏳</h3><p>Keluar akan menghentikan timer. Teruskan keluar?</p><div class="row"><button class="btn" data-a="closeM">Kekal belajar</button><button class="btn s" data-a="go" data-v="'+v+'" data-f="1">Ya, keluar</button></div>');return}
closeM();clearInterval(timer);TM.run=false;view=v;if(v==='po'){V.po={i:0,done:0};prep(25*60)}render();window.scrollTo(0,0)}
function render(){$('#nav').innerHTML=NV.map(([k,l])=>`<button class="${view===k||(k==='tech'&&!['home','prog','about','lib','emo'].includes(view.split(':')[0]))?'on':''}" data-a="go" data-v="${k}">${l}</button>`).join('')+`<button data-a="go" data-v="prog">🔥 ${streak().cur}</button><button data-a="mute" title="Bunyi">${SMUTE?'🔇':'🔊'}</button>`;
const k=view.split(':')[0];$('#m').innerHTML=(VW[k]||VW.home)();paint();if(k==='mm'&&V.map)mmDraw();if(k==='po'&&V.po.g)arcade()}
const back=()=>`<button class="btn s" data-a="go" data-v="tech">← Back to Techniques</button>`;
const noteBox=ph=>`<div class="drop" id="dz" data-a="pick"><b>📄 Seret fail ke sini</b> atau <u>tekan untuk pilih fail</u><br><small>PDF, DOCX, TXT atau gambar JPG/PNG (OCR) · maksimum 15 MB</small></div><input type="file" id="file" accept=".pdf,.docx,.txt,.md,.png,.jpg,.jpeg,.webp" hidden>${V.fn?`<div class="note" style="margin:6px 0">📎 ${esc(V.fn)} · ${V.fs}<div class="row" style="margin-top:6px"><button class="btn s" data-a="pick">Replace File</button><button class="btn o" data-a="rmf">Remove File</button></div></div>`:''}<h3>Teks nota${V.fn?' (diekstrak daripada fail, boleh disunting)':''}</h3><textarea data-k="notes" placeholder="${ph||'Tampal nota di sini, atau muat naik fail di atas...'}">${esc(S.notes)}</textarea>${S.notes.length>12000?'<p class="note">Nota panjang: AI hanya membaca 12,000 aksara pertama.</p>':''}<div id="er" class="err"></div>`;
const cards=(rec=[])=>`<div class="grid">${Object.entries(T).map(([k,t])=>`<div class="card tc">${rec.includes(k)?'<span class="badge">✨ Disyorkan</span>':''}<div class="em">${t.e}</div><h3>${t.n}</h3><p><small>Nama mesra: <b>${t.f}</b></small></p><p>${t.d}</p><p class="note">Kegunaan: ${t.u}</p><button class="btn" data-a="go" data-v="intro:${k}" style="margin-top:10px">Start Learning</button></div>`).join('')}</div>`;
const VW={
home(){const g=V.goal;return `<div class="card hero"><span class="st" style="right:20px;top:10px">⭐</span><span class="st" style="right:90px;bottom:10px">☁️</span><span class="st" style="right:150px;top:20px">📎</span><h1>Hey, Ready to Study? 📚</h1><h2 id="hi">Hi, ${esc(S.name||'guys')}! What are we learning today?</h2><div class="row"><input type="text" data-k="name" value="${esc(S.name)}" placeholder="Nama anda" style="max-width:240px"><span>📅 ${new Date().toLocaleDateString('ms-MY',{weekday:'long',day:'numeric',month:'long',year:'numeric'})}</span></div><p class="bf" style="font-size:19px">💬 ${Q[Math.floor(Math.random()*Q.length)]}</p><p class="bf"><i>Learn Smart, Study Better!</i></p></div>
${strk()}<h2 style="margin-top:22px">What is your study goal today?</h2><div class="card">${Object.entries(G).map(([k,x],i)=>`<button class="goal ${g===k?'on':''}" data-a="goal" data-v="${k}"><b>${'ABCDE'[i]}. ${x.l}</b> – ${x.d}</button>`).join('')}${g?`<div class="note" style="margin-top:8px">✨ Cadangan: <b>${G[g].r.map(r=>T[r].n).join(' + ')}</b>. ${G[g].w} Anda masih boleh pilih teknik lain.</div>`:''}</div>
<h2 style="margin-top:22px">Learning Space</h2>${cards(g?G[g].r:[])}<h2 style="margin-top:22px">Personal Space</h2><div class="grid">${[['📚','My Library','lib','Peta minda yang anda simpan'],['🌸','Mind &amp; Emotion Corner','emo','Emosi, kata hikmah dan refleksi'],['📈','My Progress','prog','Perkembangan dan streak']].map(x=>`<div class="card tc"><div class="em">${x[0]}</div><h3>${x[1]}</h3><p>${x[3]}</p><button class="btn" data-a="go" data-v="${x[2]}">Buka</button></div>`).join('')}</div>`},
tech(){return `<h1>Study Techniques</h1>${cards(V.goal?G[V.goal].r:[])}`},
intro(){const k=view.split(':')[1],t=T[k];return `<div class="card"><div class="em">${t.e}</div><h1>${t.n}</h1><p>Nama mesra: <b>${t.f}</b></p>${[['Apakah teknik ini?',t.apa],['Mengapa digunakan?',t.why],['Bilakah sesuai?',t.when],['Contoh mudah',t.ex]].map(([a,b])=>`<h3>${a}</h3><p>${b}</p>`).join('')}<h3>Langkah demi langkah</h3><ol>${t.st.map(s=>`<li>${s}</li>`).join('')}</ol><div class="row"><button class="btn" data-a="start" data-v="${k}">Let's Get Started!</button>${back()}</div></div>`},
mm(){if(V.map)return `<div class="row"><h1 style="flex:1">${T.mm.e} ${T.mm.n}</h1><button class="btn s" data-a="go" data-v="tech">← Back</button></div><div class="row" style="margin-bottom:8px"><button class="btn s" data-a="zoom" data-v="1">＋</button><button class="btn s" data-a="zoom" data-v="-1">－</button><button class="btn g" data-a="mmadd">+ Cabang</button><button class="btn s" data-a="mmcopy">📋 Copy</button><button class="btn s" data-a="mmsave">📚 Save to Library</button><button class="btn o" data-a="mmreset">Reset</button></div><div class="row" style="margin-bottom:8px">${ST.map(x=>`<button class="btn ${(V.map.s||'mind')===x[0]?'':'s'}" data-a="mmstyle" data-v="${x[0]}">${x[1]} ${x[2]}</button>`).join('')}</div>${[V.map,...(V.map.x||[])].map((m,k)=>`<h3>${SN[m.s||'mind']}</h3><div class="mmw" data-k="${k}" id="mw${k}"></div>`).join('')}<p class="note" style="margin-top:8px">Klik mana-mana kotak untuk edit, tambah subtopik atau padam.</p><p>Kata kunci: ${(V.map.k||[]).map(x=>`<span class="chip">${esc(x)}</span>`).join('')}</p>`;
return `<div class="row"><h1 style="flex:1">${T.mm.e} ${T.mm.n}</h1>${back()}</div><div class="card">${noteBox()}<h3>Choose Your Mind Map Style</h3><div class="row"><button class="btn ${V.sm==='c'?'s':''}" data-a="smode" data-v="a">Auto Select</button><button class="btn ${V.sm==='c'?'':'s'}" data-a="smode" data-v="c">Choose Myself</button></div>${V.sm==='c'?ST.map(x=>`<button class="goal ${(V.st||'mind')===x[0]?'on':''}" data-a="sty" data-v="${x[0]}"><b>${x[1]} ${x[2]}</b> – ${x[3]}</button>`).join(''):'<p class="note">Auto Select: sistem memilih jenis peta berdasarkan kandungan nota. Anda boleh tukar jenis selepas itu.</p>'}<div class="row" style="margin-top:10px"><button class="btn" data-a="mmgen">Generate Mind Map</button><button class="btn s" data-a="go" data-v="lib">📚 My Library (${(S.lib||[]).length})</button></div><p class="note" style="margin-top:8px">Ringkasan dijana oleh AI jika tersedia; jika tidak, kaedah tempatan digunakan. Semak dan edit hasilnya.</p></div>${V.an?anHtml(V.an):''}`},
fc(){const f=V.fc;if(!f)return `<div class="row"><h1 style="flex:1">${T.fc.e} ${T.fc.n}</h1>${back()}</div><div class="card">${noteBox('Tampal nota. Format "istilah: maksud" menghasilkan kad terbaik.')}<h3>Mod</h3><div class="row"><button class="btn ${V.fm!=='t'?'':'s'}" data-a="fmode" data-v="u">Untimed</button><button class="btn ${V.fm==='t'?'':'s'}" data-a="fmode" data-v="t">Timed</button>${V.fm==='t'?[15,30,45].map(m=>`<button class="btn ${(V.ft||15)===m?'g':'s'}" data-a="ftime" data-v="${m}">${m} min</button>`).join(''):''}</div><br><button class="btn" data-a="fcgen">Generate Flashcards</button></div>`;
if(f.rev)return fcRev(f);if(f.done){const rv=f.c.filter((c,i)=>f.k[i]!==true);return `<h1>Ringkasan Sesi 🎉</h1><div class="card"><p>Jumlah kad: <b>${f.c.length}</b></p><p>Dikuasai: <b>${f.c.length-rv.length}</b></p><p>Perlu diulang kaji: <b>${rv.length}</b></p>${rv.map(c=>`<p>• ${esc(c.q)}<br><span class="g1">${esc(c.a)}</span></p>`).join('')}<div class="row"><button class="btn" data-a="fcagain">Ulang semua</button>${rv.length?'<button class="btn o" data-a="fcrev">Ulang yang lemah sahaja</button>':''}<button class="btn s" data-a="go" data-v="tech">Selesai</button></div></div>`}
return `<div class="row"><h1 style="flex:1">Kad ${f.i+1}/${f.c.length}</h1>${V.fm==='t'?'<b class="bf" style="font-size:24px">⏱ <span id="tm"></span></b>':''}<button class="btn s" data-a="fcend">Tamat sesi</button></div><p class="note">Cuba jawab dalam fikiran dahulu, kemudian klik kad.</p><div class="fc ${f.f?'f':''}" data-a="flip"><div class="fi"><div class="fs">${esc(f.c[f.i].q)}</div><div class="fs bk">${esc(f.c[f.i].a)}</div></div></div><div class="row" style="justify-content:center"><button class="btn s" data-a="fnav" data-v="-1">← Previous</button><button class="btn g" data-a="fmark" data-v="1">✅ I Know This</button><button class="btn o" data-a="fmark" data-v="0">🔁 Need More Practice</button><button class="btn s" data-a="fnav" data-v="1">Next →</button></div>`},
mn(){const m=V.mn;return `<div class="row"><h1 style="flex:1">${T.mn.e} ${T.mn.n}</h1>${back()}</div><div class="card"><p class="note">Mnemonic tidak perlu untuk semua nota. Study4A hanya memilih proses, urutan atau senarai yang sukar dihafal.</p>${noteBox('Tampal nota atau senarai, contoh: Merah, Jingga, Kuning, Hijau, Biru, Indigo, Ungu')}<div class="row" style="margin:8px 0">${[['x','Auto Select'],['a','Meaningful Acronym'],['s','Sentence'],['t','Short'],['m','Mixed']].map(x=>`<button class="btn ${(V.mt||'x')===x[0]?'':'s'}" data-a="mnty" data-v="${x[0]}">${x[1]}</button>`).join('')}</div><button class="btn" data-a="mngen">Create My Mnemonic</button></div>${(V.sets||[]).length>1?`<div class="card" style="margin-top:14px"><b>Bahagian sukar dihafal yang ditemui:</b><div class="row" style="margin-top:6px">${V.sets.map((s,i)=>`<button class="btn ${V.si===i?'':'s'}" data-a="mnset" data-v="${i}">${esc(s.t)} (${s.items.length})</button>`).join('')}</div></div>`:''}${m?`<div class="card" style="margin-top:14px"><h3>${esc(((V.sets||[])[V.si]||{}).t||'Mnemonic')} · Cadangan ${m.v+1}</h3><div class="big" style="color:var(--p)">${esc(m.w||m.a)}</div>${m.w?'':'<p class="note">Tiada perkataan bermakna yang sepadan tanpa mengubah fakta, jadi huruf awal digunakan. Gunakan ayat bantuan di bawah.</p>'}<p><b>Cara dibentuk:</b> ${m.v===0?'huruf pertama setiap item':m.v===1?'dua huruf pertama setiap item':'huruf pertama setiap item, disebut sebagai perkataan'}, mengikut susunan asal. Tiada item tertinggal.</p><p>${m.items.map((x,i)=>`<span class="chip"><b>${esc(m.parts[i])}</b> = ${esc(x)}</span>`).join('')}</p><p><b>Ayat kreatif:</b> ${m.s?esc(m.s):'bayangkan setiap item sebagai watak, lalu cipta cerita ikut turutan.'}</p><div class="row"><button class="btn s" data-a="mnother">Generate Another</button><button class="btn s" data-a="mnedit">Edit Mnemonic</button><button class="btn s" data-a="mncopy">Copy</button><button class="btn s" data-a="mnsave">Save</button><button class="btn g" data-a="mnprac">Practice Mode</button></div>${m.p?`<hr><p>Akronim: <b>${esc(m.a)}</b>. Taip semua item (asingkan dengan koma):</p><textarea data-k="mp" style="min-height:80px">${esc(V.mp||'')}</textarea><button class="btn" data-a="mncheck">Semak</button><div id="mr"></div>`:''}</div>`:`<div class="emp">✨ Masukkan senarai untuk melihat akronim anda.</div>`}`},
po(){const p=V.po,st=p.i%2===0;return `<div class="row"><h1 style="flex:1">${T.po.e} ${T.po.n}</h1>${back()}</div><div class="card" style="text-align:center"><h2>${st?'📖 Study Time':'☕ Break Time'}</h2><p>Sesi ${Math.min(Math.floor(p.i/2)+1,4)} / 4</p>${p.g?arcH():ringH()}<div class="dots">${[0,1,2,3].map(i=>`<div class="dot ${i<p.done?'d':''}">${i<p.done?'✅':i+1}</div>`).join('')}</div><div class="row" style="justify-content:center">${TM.run?'<button class="btn" data-a="ppause">⏸ Pause</button>':TM.left<TM.total?'<button class="btn" data-a="presume">▶ Resume</button>':'<button class="btn" data-a="pstart">▶ Start</button>'}<button class="btn s" data-a="preset">Reset</button><button class="btn o" data-a="pend1">End Session</button></div><p class="note">Kitaran: 25/5, 25/5, 25/5, 25 kemudian rehat panjang 30 minit.</p></div>`},
bl(){const b=V.bl||{ph:'in'};const n=S.notes;
if(b.ph==='in')return `<div class="row"><h1 style="flex:1">${T.bl.e} ${T.bl.n}</h1>${back()}</div><div class="card">${noteBox()}<button class="btn" data-a="blread">Mula membaca (10 minit)</button></div>`;
if(b.ph==='read')return `<h1>Baca &amp; fahami 📖</h1><div class="card"><div class="big" id="tm"></div><div style="white-space:pre-wrap;max-height:50vh;overflow:auto">${esc(n)}</div><br><button class="btn" data-a="blhide">Saya sudah sedia, sembunyikan nota</button></div>`;
if(b.ph==='choose')return `<h1>Nota disembunyikan 🙈</h1><div class="grid"><div class="card"><h3>📝 Paper Mode</h3><p>Saya mahu menulis di atas kertas sendiri.</p>${[5,10,15].map(m=>`<button class="btn s" data-a="blpaper" data-v="${m}">${m} min</button> `).join('')}</div><div class="card"><h3>⌨️ Digital Mode</h3><p>Saya mahu menulis dalam website.</p><button class="btn" data-a="bldig">Mula menulis</button></div></div>`;
if(b.ph==='paper')return `<h1>Tulis di kertas ✍️</h1><div class="card" style="text-align:center">${ringH()}<button class="btn o" data-a="blfinish">Saya sudah siap</button></div>`;
if(b.ph==='pdone')return `<div class="card"><h2>Masa menulis tamat ⏰</h2><p>Sekarang semak kertas anda dengan nota asal. Tandakan apa yang betul, salah dan tertinggal.</p><div class="row"><button class="btn" data-a="blorig">View Original Notes</button><button class="btn s" data-a="blagain">Try Again</button><button class="btn g" data-a="blsave">Save Results</button></div></div>`;
if(b.ph==='dig')return `<h1>Tulis semua yang anda ingat ✍️</h1><div class="card"><textarea data-k="ba" style="min-height:300px">${esc(V.ba||'')}</textarea><div id="er" class="err"></div><button class="btn" data-a="blsubmit">Submit Answer</button></div>`;
if(b.ph==='orig')return `<div class="card"><h3>Nota asal</h3><div style="white-space:pre-wrap">${esc(n)}</div><br><button class="btn" data-a="blback">← Kembali</button></div>`;
const r=b.r,L=(a,c)=>a.length?a.map(s=>`<p><span class="${c}">${esc(s)}</span></p>`).join(''):'<p class="note">Tiada.</p>';
return `<h1>Keputusan 📊</h1><p class="note">${r.ai?'Analisis oleh AI berdasarkan nota anda. AI boleh tersilap, jadi semak dengan nota asal.':'AI tidak tersedia, jadi analisis ini anggaran berdasarkan padanan perkataan dan mungkin tidak faham sinonim.'}</p><div class="card"><h3>1. Berjaya diingat (hijau)</h3>${L(r.ok,'g1')}<h3>2. Kurang tepat</h3>${L(r.part,'y1')}${r.bad.length?'<h3>Tidak ditemui dalam nota (merah)</h3>'+L(r.bad,'r1'):''}<h3>3. Tertinggal (kuning)</h3>${L(r.miss,'y1')}<h3>4. Perlu diulang kaji</h3><p>${[...r.miss,...r.part].slice(0,5).map(s=>'<span class="chip">'+esc(keyw(s,2).join(', ')||s.slice(0,30))+'</span>').join('')||'Hebat, semua isi utama disebut!'}</p><div class="row"><button class="btn" data-a="blagain">Try Again</button><button class="btn s" data-a="blorig">View Original Notes</button><button class="btn g" data-a="blsave">Save Results</button></div></div>`},
prog(){const P=S.prog;if(!P.length)return `<h1>My Progress</h1>${strk()}<div class="card emp" style="margin-top:16px"><div class="em">🌱</div><h3>Belum ada rekod</h3><p>Siapkan satu sesi untuk melihat perkembangan anda di sini.</p><button class="btn" data-a="go" data-v="tech">Mula belajar</button></div>`;
const c={};P.forEach(x=>c[x.t]=(c[x.t]||0)+1);const mx=Math.max(...Object.values(c)),top=Object.keys(c).sort((a,b)=>c[b]-c[a])[0],min=Math.round(P.reduce((a,x)=>a+(x.min||0),0));
const fcn=P.filter(x=>x.t==='fc').reduce((a,x)=>a+(x.n||0),0),pom=P.filter(x=>x.t==='po').length;
return `<h1>My Progress 🌟</h1>${strk()}<div class="grid" style="margin-top:16px">${[['📚','Jumlah sesi',P.length],['⏱','Minit belajar',min],['❤️','Paling kerap',T[top].n],['🃏','Flashcard dikuasai',fcn],['🍅','Sesi Pomodoro',pom]].map(([e,l,v])=>`<div class="card"><div class="em">${e}</div><div class="bf" style="font-size:26px">${v}</div>${l}</div>`).join('')}</div><div class="card" style="margin-top:16px"><h3>Penggunaan teknik</h3>${Object.keys(T).map(k=>`<div class="row"><span style="width:150px">${T[k].e} ${T[k].n}</span><div class="bar" style="width:${(c[k]||0)/mx*60}%;${c[k]?'':'opacity:.2'}"></div><b>${c[k]||0}</b></div>`).join('')}</div><div class="card" style="margin-top:16px"><h3>Aktiviti terkini</h3>${P.slice(0,8).map(x=>`<p>${T[x.t].e} ${T[x.t].n} · ${x.info||''} · <small>${new Date(x.d).toLocaleString('ms-MY')}</small></p>`).join('')}</div>`},
sm(){const u=V.sum;return `<div class="row"><h1 style="flex:1">${T.sm.e} ${T.sm.n}</h1>${back()}</div><div class="card">${noteBox()}<h3>Tahap penerangan</h3><div class="row">${[['s','Simple'],['n','Standard'],['d','Detailed']].map(x=>`<button class="btn ${(V.sl||'n')===x[0]?'':'s'}" data-a="slv" data-v="${x[0]}">${x[1]}</button>`).join('')}</div><br><button class="btn" data-a="smgen">Generate Summary</button></div>${u?`<div class="card" style="margin-top:14px"><p class="note">${u.ai?'Dijana oleh AI daripada nota anda. AI boleh tersilap, semak dengan nota asal.':'AI tidak tersedia: ayat penting dipilih secara tempatan (bukan ringkasan semantik). Semak dengan nota asal.'}</p>${V.se?`<textarea data-k="stxt" style="min-height:260px">${esc(V.stxt)}</textarea>`:`<div style="white-space:pre-wrap">${esc(u.txt)}</div>`}<div class="row" style="margin-top:10px"><button class="btn s" data-a="smcopy">Copy Summary</button><button class="btn s" data-a="smedit">${V.se?'Done Editing':'Edit Summary'}</button><button class="btn s" data-a="smsave">Save Summary</button><button class="btn g" data-a="smmap">Convert to Mind Map</button></div></div>`:'<div class="emp">📝 Masukkan nota untuk melihat ringkasan.</div>'}`},
lib(){const L=S.lib||[];if(!L.length)return `<h1>📚 My Library</h1><div class="card emp"><div class="em">🗂️</div><h3>Library masih kosong</h3><p>Hasilkan peta minda dan tekan Save to Library.</p><button class="btn" data-a="go" data-v="intro:mm">Cipta peta minda</button></div>`;return `<h1>📚 My Library</h1><div class="grid">${L.map(x=>`<div class="card"><h3>${esc(x.t)}</h3><p><small>${x.type} · ${new Date(x.d).toLocaleDateString('ms-MY')}</small></p><p>${x.map?x.map.b.slice(0,4).map(b=>`<span class="chip">${esc(b.l)}</span>`).join(''):'<small>'+esc(x.sum.slice(0,120))+'…</small>'}</p><div class="row"><button class="btn" data-a="libopen" data-id="${x.id}">Open</button><button class="btn s" data-a="librn" data-id="${x.id}">Rename</button><button class="btn o" data-a="libdel" data-id="${x.id}">Delete</button></div></div>`).join('')}</div>`},
emo(){const t=V.et||'ci',e=V.em,tabs=[['ci','😊 Check-in'],['wis','📜 Words of Wisdom'],['ref','📔 Reflection']].map(([k,l])=>`<button class="btn ${t===k?'':'s'}" data-a="etab" data-v="${k}">${l}</button>`).join(' ');let h='';
if(t==='ci')h=`<h2>How are you feeling today?</h2><div class="row">${EM.map((x,i)=>`<button class="eb ${e===i?'on':''}" data-a="emsel" data-v="${i}"><span class="emo">${x[0]}</span><br>${x[1]}</button>`).join('')}</div>${e!=null?`<h3>Would you like to tell us why? (pilihan)</h3><textarea data-k="why" style="min-height:90px" placeholder="Boleh langkau jika tidak mahu">${esc(V.why||'')}</textarea><div class="note" style="margin:8px 0">${EM[e][2]}</div><p><b>Cuba:</b> ${EM[e][3]}</p><div class="row"><button class="btn g" data-a="emsave">Save Check-in</button><button class="btn s" data-a="emskip">Skip</button></div>`:'<p class="note">Tiada emosi yang salah. Anda boleh langkau bila-bila masa.</p>'}`;
if(t==='wis'){const i=V.wi!=null?V.wi:new Date().getDate()%WS.length,F=S.fav||[];h=`<h2>A Little Wisdom for Today</h2><div class="row"><button class="btn s" data-a="wdaily">📅 Daily Wisdom</button><button class="btn s" data-a="wrand">🎲 Random Quote</button><button class="btn s" data-a="wfavs">⭐ My Favourite Quotes (${F.length})</button></div>`+(V.wf?(F.length?F.map(wcard).join(''):'<div class="emp">Belum ada kegemaran. Tekan Save Favourite pada kata hikmah.</div>'):wcard(i))}
if(t==='ref'){const R=S.ref||[];h=`<h2>Today’s Little Reflection</h2>`+RQ.map((q,i)=>`<h3>${q}</h3><textarea data-k="rf${i}" style="min-height:70px">${esc(V['rf'+i]||'')}</textarea>`).join('')+`<div class="row" style="margin:8px 0"><button class="btn g" data-a="rfsave">${V.rfid?'Update Reflection':'Save Reflection'}</button></div><h3>Previous Reflections</h3>`+(R.length?R.map(r=>`<div class="card" style="margin-bottom:10px"><b>${new Date(r.d).toLocaleDateString('ms-MY')}</b>${r.a.map((a,i)=>a?`<p><small>${RQ[i]}</small><br>${esc(a)}</p>`:'').join('')}<div class="row"><button class="btn s" data-a="rfedit" data-id="${r.id}">Edit</button><button class="btn o" data-a="rfdel" data-id="${r.id}">Delete</button></div></div>`).join(''):'<div class="emp">Belum ada refleksi.</div>')}
return `<div class="card calm"><h1>🌸 Mind &amp; Emotion Corner</h1><p><i>Take Care of Your Mind, One Day at a Time.</i></p><div class="row">${tabs}</div></div><div style="margin-top:14px">${h}</div><p class="note" style="margin-top:14px">🔒 Emosi dan refleksi disimpan dalam peranti anda sahaja. Ruang ini bukan diagnosis. Jika perasaan terlalu berat atau berpanjangan, bercakaplah dengan ibu bapa, guru kaunseling atau orang dewasa yang dipercayai.</p>`},
about(){return `<div class="card"><h1>About Study4A ✏️</h1><p>Study4A: <i>Learn Smart, Study Better!</i> Lima teknik belajar dalam satu tempat, tanpa login.</p><h3>Kejujuran prototaip</h3><ul><li>Mind map, flashcard, ayat mnemonics dan analisis Brain Dump dijana oleh <b>AI</b> apabila tersedia. Jika tidak, aplikasi guna padanan perkataan tempatan. AI boleh tersilap, jadi semak dengan nota.</li><li>Upload PDF belum disokong. Gunakan Copy &amp; Paste atau fail .txt.</li><li>Data disimpan dalam pelayar anda sahaja (jika dibenarkan).</li></ul></div><div class="card" style="margin-top:14px"><h3>💾 Backup &amp; Restore</h3><p>Data disimpan dalam pelayar, pada domain ini sahaja. Sebelum berpindah ke laman web baharu, tekan Copy Backup, simpan teksnya, kemudian tampal di laman baharu dan tekan Restore.</p><button class="btn s" data-a="bkcopy">Copy Backup</button><textarea data-k="bk" placeholder="Tampal backup di sini untuk Restore" style="min-height:90px;margin:8px 0">${esc(V.bk||'')}</textarea><button class="btn" data-a="bkrestore">Restore</button><div id="er" class="err"></div></div>`}};

// Mind map
const dk=d=>{d=d||new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')};
function streak(){const s=new Set(S.days||[]);let d=new Date(),n=0;if(!s.has(dk(d)))d.setDate(d.getDate()-1);while(s.has(dk(d))){n++;d.setDate(d.getDate()-1)}let best=0,run=0,prev=null;[...s].sort().forEach(x=>{const t=new Date(x+'T00:00:00');run=prev&&Math.round((t-prev)/864e5)===1?run+1:1;prev=t;best=Math.max(best,run)});return{cur:n,best,total:s.size}}
const strk=()=>{const s=streak(),set=new Set(S.days||[]);const wk=[...Array(7)].map((_,i)=>{const d=new Date();d.setDate(d.getDate()-6+i);const on=set.has(dk(d));return `<div class="dot ${on?'d':''}" title="${dk(d)}">${on?'🔥':d.toLocaleDateString('ms-MY',{weekday:'narrow'})}</div>`}).join('');return `<div class="card" style="margin-top:16px"><h3><span class="fl">🔥</span> My Learning Streak</h3><div class="row"><span class="chip"><b>${s.cur}</b> Current Streak</span><span class="chip"><b>${s.best}</b> Longest Streak</span><span class="chip"><b>${s.total}</b> Total Study Days</span></div><div class="dots">${wk}</div><p class="note">${s.cur?'Hebat! Teruskan usaha anda. 🔥':'Every new day is another chance to learn. Let’s start again!'}</p></div>`};

const AMB={nm:0,nb:0,beat:0,mode:0,bg:null,src:null};
function ambMode(){if(!TM.run||TM.left<=0||SMUTE)return 0;if(view==='po'&&V.po&&!V.po.g)return V.po.i%2?2:1;if(view==='fc'&&V.fc&&!V.fc.rev&&!V.fc.done&&V.fm==='t')return 1;return 0}

function breath(){const c=getAC();if(!c)return;const t=c.currentTime+.05,n=c.sampleRate*3,buf=c.createBuffer(1,n,c.sampleRate),d=buf.getChannelData(0);for(let i=0;i<n;i++)d[i]=Math.random()*2-1;
const src=c.createBufferSource();src.buffer=buf;src.loop=true;const bp=c.createBiquadFilter();bp.type='bandpass';bp.Q.value=.7;bp.frequency.setValueAtTime(350,t);bp.frequency.linearRampToValueAtTime(850,t+4);bp.frequency.linearRampToValueAtTime(300,t+9);

src.connect(bp);bp.connect(lp);lp.connect(g);g.connect(c.destination);src.start(t);src.stop(t+9.2);AMB.bg=g;AMB.src=src;AMB.nb=t+9.8}
